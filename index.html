<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Waitangi Wheel check-in — Te Awhi</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="wheel.js"></script>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>Waitangi Wheel check-in</h1>
    <p class="sub" id="greeting">Your whānau check-in for the Whakamana hīkoi</p>

    <div id="app" style="display:none">
      <details class="explain noprint" id="explain">
        <summary>He aha tēnei? — What is this wheel &amp; how do I score it?</summary>
        <div id="explainBody"></div>
      </details>

      <div class="row" id="weekbtns">
        <button class="weekbtn active" data-week="w1">
          <svg width="14" height="14"><circle cx="7" cy="7" r="6" fill="currentColor"/></svg> Week 1
        </button>
        <button class="weekbtn" data-week="w5">
          <svg width="14" height="14"><polygon points="7,0.5 13.5,13 0.5,13" fill="currentColor"/></svg> Week 5
        </button>
        <button class="weekbtn" data-week="w10">
          <svg width="14" height="14"><rect x="1" y="1" width="12" height="12" fill="currentColor"/></svg> Week 10
        </button>
      </div>
      <p class="hint" id="hint">Tap along each spoke to mark how it feels right now. Tap the same spot again to clear it.</p>

      <div class="wheelbox" id="wheelbox"></div>
      <p class="status" id="status"></p>

      <div id="submitArea" class="noprint" style="text-align:center;margin-top:10px"></div>

      <table id="summary"></table>

      <div class="actions">
        <button class="btn" onclick="window.print()">Print / save as PDF</button>
      </div>
    </div>

    <div id="message" class="msg">Loading your wheel…</div>
  </div>
</div>

<script>
(function(){
  const W = window.WaitangiWheel;
  const cfg = window.WHEEL_CONFIG;
  const token = new URLSearchParams(location.search).get("t");
  const $ = id => document.getElementById(id);

  if(!token){
    $("message").textContent = "This page needs your personal link. Please use the link Te Awhi gave you.";
    return;
  }
  if(cfg.SUPABASE_URL.startsWith("PASTE")){
    $("message").textContent = "Not set up yet — the Supabase details in config.js are missing.";
    return;
  }

  const sb = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);
  let weeks = W.emptyWeeks();
  let locked = { w1:false, w5:false, w10:false };
  let activeWeek = "w1";

  function setStatus(text, cls){
    $("status").textContent = text;
    $("status").className = "status " + (cls || "");
  }

  function draw(){
    const isLocked = locked[activeWeek];
    W.render($("wheelbox"), {
      weeks, activeWeek, interactive: !isLocked,
      onTap: (axis, level) => {
        if(locked[activeWeek]) return;
        weeks[activeWeek][axis] = (weeks[activeWeek][axis] === level) ? null : level;
        draw();
        save();
      }
    });
    W.renderTable($("summary"), weeks);
    $("hint").textContent = isLocked
      ? `${W.WEEK_META[activeWeek].name} has been submitted — it's locked in. Ka pai!`
      : "Tap along each spoke to mark how it feels right now. Tap the same spot again to clear it.";
    renderSubmit();
  }

  function renderSubmit(){
    const area = $("submitArea");
    const meta = W.WEEK_META[activeWeek];
    if(locked[activeWeek]){
      area.innerHTML = `<span class="lockbanner">✓ ${meta.name} submitted &amp; locked</span>`;
      return;
    }
    const filled = weeks[activeWeek].filter(v => v).length;
    area.innerHTML = `
      <button class="btn primary" id="submitBtn" ${filled < 6 ? "disabled" : ""}>Submit ${meta.name}</button>
      <div class="small" style="margin-top:6px;color:var(--mid)">
        ${filled < 6 ? `Mark all six spokes to submit (${filled}/6 done).` : "Once submitted, this week is locked and can't be changed."}
      </div>`;
    const btn = $("submitBtn");
    if(btn) btn.addEventListener("click", submitWeek);
  }

  let saveTimer = null;
  function save(){
    setStatus("Saving…");
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveNow, 400);
  }
  async function saveNow(){
    clearTimeout(saveTimer);
    const { error } = await sb.rpc("wheel_save", {
      p_token: token, p_week: activeWeek, p_spokes: weeks[activeWeek]
    });
    if(error){ setStatus("Couldn't save — check your connection and tap again.", "err"); return false; }
    setStatus("Saved ✓", "ok"); setTimeout(()=>setStatus(""), 2000);
    return true;
  }

  async function submitWeek(){
    const meta = W.WEEK_META[activeWeek];
    if(!confirm(`Submit ${meta.name}? Once submitted, your marks for ${meta.name} are locked in and can't be changed.`)) return;
    const wk = activeWeek;
    const savedOk = await saveNow();
    if(!savedOk) return;
    const { error } = await sb.rpc("wheel_submit", { p_token: token, p_week: wk });
    if(error){
      setStatus("Couldn't submit — please try again.", "err");
      return;
    }
    locked[wk] = true;
    setStatus(`${meta.name} submitted ✓`, "ok");
    draw();
  }

  document.querySelectorAll(".weekbtn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      activeWeek = btn.dataset.week;
      document.querySelectorAll(".weekbtn").forEach(b=>b.classList.toggle("active", b===btn));
      draw();
    });
  });

  (async function load(){
    const { data, error } = await sb.rpc("wheel_get", { p_token: token });
    if(error){
      $("message").textContent = "Something went wrong loading your wheel. Please try again shortly.";
      return;
    }
    if(!data){
      $("message").textContent = "This link wasn't recognised. Please check with Te Awhi for your personal link.";
      return;
    }
    for(const w of W.WEEKS){
      const entry = data.weeks?.[w];
      if(Array.isArray(entry)){                 // old format
        weeks[w] = entry;
      } else if(entry && Array.isArray(entry.spokes)){
        weeks[w] = entry.spokes;
        locked[w] = !!entry.submitted;
      }
    }
    $("greeting").textContent = `Kia ora ${data.name} — your whānau check-in for the Whakamana hīkoi`;
    $("explainBody").innerHTML = W.explanationHtml();
    // open the explanation the first time (no marks yet at all)
    const nothingYet = W.WEEKS.every(w => !weeks[w].some(v=>v));
    if(nothingYet) $("explain").setAttribute("open", "");
    $("message").style.display = "none";
    $("app").style.display = "";
    draw();
  })();
})();
</script>
</body>
</html>
